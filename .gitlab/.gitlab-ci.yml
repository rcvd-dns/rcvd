# GitLab CI/CD pipeline for rcvd — test, then cross-compile static binaries.
#
# This file lives at a NON-default path (.gitlab/.gitlab-ci.yml); point the
# project's "CI/CD configuration file" setting at it to activate.
#
# rcvd is pure Go, CGO_ENABLED=0, so every target cross-compiles from one Linux
# image with no C toolchain — the same recipe as scripts/ (static, stripped,
# -trimpath), plus provenance stamped into --version (buildSource=gitlab-runner).

image: docker.io/library/golang:1.27-alpine

stages:
  - test
  - build
  - release

variables:
  CGO_ENABLED: "0"
  # Keep the module/build cache inside the project dir so it can be cached below.
  GOPATH: "$CI_PROJECT_DIR/.gocache/gopath"
  GOCACHE: "$CI_PROJECT_DIR/.gocache/gobuild"

# Shared module/build cache — keyed on go.sum so it invalidates on dep changes.
cache:
  key:
    files:
      - go.sum
  paths:
    - .gocache/

# Provenance stamped into the binary and reported by `rcvd --version`:
#   buildSource — always "gitlab-runner" here (vs "local" for a dev build).
#   version     — the git tag on a tagged pipeline, else the short commit SHA.
#   buildDate   — UTC RFC-3339 build timestamp.
.build_ldflags: &build_ldflags |
  BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
  BUILD_VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
  LDFLAGS="-s -w -X main.buildDate=${BUILD_DATE} -X main.buildSource=gitlab-runner -X main.version=${BUILD_VERSION}"

test:
  stage: test
  script:
    - go vet ./...
    - go test ./...

# Prove the committed DNSSEC root anchor (internal/dnssec/root-anchors.xml) still
# matches IANA's cryptographically signed anchor (CMS/S-MIME chained to the pinned
# ICANN CA) before anything builds — a tampered or stale anchor (e.g. after a
# missed KSK rollover) fails this stage and blocks every build job below.
# The alpine golang image lacks openssl/curl, so install them first.
verify-anchors:
  stage: test
  script:
    - apk add --no-cache openssl curl
    - sh scripts/verify-anchors.sh

# Template for the per-target cross-compile jobs. Each sets GOOS/GOARCH and the
# artifact name; the recipe (static, stripped, -trimpath) is identical to scripts/.
.build:
  stage: build
  needs: ["test", "verify-anchors"]   # don't ship if the trust anchor doesn't verify
  script:
    - *build_ldflags
    - GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" go build -trimpath -ldflags "$LDFLAGS" -o "$ARTIFACT" ./cmd/rcvd
    - echo "Built $ARTIFACT ($BUILD_VERSION, $BUILD_DATE)"
  artifacts:
    name: "$ARTIFACT"
    paths:
      - "$ARTIFACT"
    expire_in: 30 days

build:linux-amd64:
  extends: .build
  variables: { TARGET_OS: linux,  TARGET_ARCH: amd64, ARTIFACT: rcvd-linux-amd64 }

build:linux-arm64:
  extends: .build
  variables: { TARGET_OS: linux,  TARGET_ARCH: arm64, ARTIFACT: rcvd-linux-arm64 }

build:macos-amd64:
  extends: .build
  variables: { TARGET_OS: darwin, TARGET_ARCH: amd64, ARTIFACT: rcvd-macos-amd64 }

build:macos-arm64:
  extends: .build
  variables: { TARGET_OS: darwin, TARGET_ARCH: arm64, ARTIFACT: rcvd-macos-arm64 }

build:netbsd-amd64:
  extends: .build
  variables: { TARGET_OS: netbsd, TARGET_ARCH: amd64, ARTIFACT: rcvd-netbsd-amd64 }

build:netbsd-arm64:
  extends: .build
  variables: { TARGET_OS: netbsd, TARGET_ARCH: arm64, ARTIFACT: rcvd-netbsd-arm64 }

build:freebsd-amd64:
  extends: .build
  variables: { TARGET_OS: freebsd, TARGET_ARCH: amd64, ARTIFACT: rcvd-freebsd-amd64 }

build:freebsd-arm64:
  extends: .build
  variables: { TARGET_OS: freebsd, TARGET_ARCH: arm64, ARTIFACT: rcvd-freebsd-arm64 }

# Collect every built binary and checksum them into a single SHA256SUMS file.
# On tagged pipelines this becomes a release asset; it also runs on non-tag
# pipelines so the checksums are verified on every build, not just at release.
# (sha256 is the only integrity check we trust — see the project's ZFS note.)
checksums:
  stage: release
  needs:
    - build:linux-amd64
    - build:linux-arm64
    - build:macos-amd64
    - build:macos-arm64
    - build:netbsd-amd64
    - build:netbsd-arm64
    - build:freebsd-amd64
    - build:freebsd-arm64
  script:
    - sha256sum rcvd-linux-* rcvd-macos-* rcvd-netbsd-* rcvd-freebsd-* | tee SHA256SUMS
  artifacts:
    paths:
      - SHA256SUMS
      - rcvd-linux-*
      - rcvd-macos-*
      - rcvd-netbsd-*
      - rcvd-freebsd-*
    expire_in: 30 days

# Publish a GitLab Release on a version tag (e.g. v0.1.0), attaching the 8
# binaries + SHA256SUMS as release assets. Only runs on tag pipelines.
# The generic-package upload gives each asset a permanent, non-expiring URL that
# the Release links to (pipeline artifacts alone expire; release assets must not).
release:
  stage: release
  needs: ["checksums"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  variables:
    PKG: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/rcvd/${CI_COMMIT_TAG}"
  script:
    - |
      apk add --no-cache curl
      for f in rcvd-linux-amd64 rcvd-linux-arm64 rcvd-macos-amd64 rcvd-macos-arm64 \
               rcvd-netbsd-amd64 rcvd-netbsd-arm64 rcvd-freebsd-amd64 rcvd-freebsd-arm64 SHA256SUMS; do
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" "${PKG}/${f}"
        echo "uploaded $f"
      done
    - |
      release-cli create \
        --name "rcvd ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --description "Static ${CI_COMMIT_TAG} binaries. Verify with SHA256SUMS." \
        --assets-link "{\"name\":\"rcvd-linux-amd64\",\"url\":\"${PKG}/rcvd-linux-amd64\"}" \
        --assets-link "{\"name\":\"rcvd-linux-arm64\",\"url\":\"${PKG}/rcvd-linux-arm64\"}" \
        --assets-link "{\"name\":\"rcvd-macos-amd64\",\"url\":\"${PKG}/rcvd-macos-amd64\"}" \
        --assets-link "{\"name\":\"rcvd-macos-arm64\",\"url\":\"${PKG}/rcvd-macos-arm64\"}" \
        --assets-link "{\"name\":\"rcvd-netbsd-amd64\",\"url\":\"${PKG}/rcvd-netbsd-amd64\"}" \
        --assets-link "{\"name\":\"rcvd-netbsd-arm64\",\"url\":\"${PKG}/rcvd-netbsd-arm64\"}" \
        --assets-link "{\"name\":\"rcvd-freebsd-amd64\",\"url\":\"${PKG}/rcvd-freebsd-amd64\"}" \
        --assets-link "{\"name\":\"rcvd-freebsd-arm64\",\"url\":\"${PKG}/rcvd-freebsd-arm64\"}" \
        --assets-link "{\"name\":\"SHA256SUMS\",\"url\":\"${PKG}/SHA256SUMS\"}"
