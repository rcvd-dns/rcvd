checksums:
  stage: release
  needs:
    - job: build:linux-amd64
      artifacts: true
      optional: false
    - job: build:linux-arm64
      artifacts: true
      optional: false
    - job: build:macos-amd64
      artifacts: true
      optional: false
    - job: build:macos-arm64
      artifacts: true
      optional: false
    - job: build:netbsd-amd64
      artifacts: true
      optional: false
    - job: build:netbsd-arm64
      artifacts: true
      optional: false
    - job: build:freebsd-amd64
      artifacts: true
      optional: false
    - job: build:freebsd-arm64
      artifacts: true
      optional: false
  script:
    - >-
      sha256sum rcvd-linux-* rcvd-macos-* rcvd-netbsd-* rcvd-freebsd-* | tee
      SHA256SUMS
  artifacts:
    paths:
      - SHA256SUMS
      - rcvd-linux-*
      - rcvd-macos-*
      - rcvd-netbsd-*
      - rcvd-freebsd-*
    expire_in: 30 days
  cache:
    - key: *ref_0
      paths: *ref_1
      policy: pull-push
      when: on_success
  image:
    name: docker.io/library/golang:1.26.4-alpine
release:
  stage: release
  needs:
    - job: checksums
      artifacts: true
      optional: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  image:
    name: registry.gitlab.com/gitlab-org/release-cli:latest
  variables:
    PKG: >-
      ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/rcvd/${CI_COMMIT_TAG}
  script:
    - >
      apk add --no-cache curl

      for f in rcvd-linux-amd64 rcvd-linux-arm64 rcvd-macos-amd64
      rcvd-macos-arm64 \
               rcvd-netbsd-amd64 rcvd-netbsd-arm64 rcvd-freebsd-amd64 rcvd-freebsd-arm64 SHA256SUMS; do
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" "${PKG}/${f}"
        echo "uploaded $f"
      done
    - |
      release-cli create \
        --name "rcvd ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --description "Static ${CI_COMMIT_TAG} binaries. Verify with SHA256SUMS." \
        --assets-link "{\"name\":\"rcvd-linux-amd64\",\"url\":\"${PKG}/rcvd-linux-amd64\"}" \
        --assets-link "{\"name\":\"rcvd-linux-arm64\",\"url\":\"${PKG}/rcvd-linux-arm64\"}" \
        --assets-link "{\"name\":\"rcvd-macos-amd64\",\"url\":\"${PKG}/rcvd-macos-amd64\"}" \
        --assets-link "{\"name\":\"rcvd-macos-arm64\",\"url\":\"${PKG}/rcvd-macos-arm64\"}" \
        --assets-link "{\"name\":\"rcvd-netbsd-amd64\",\"url\":\"${PKG}/rcvd-netbsd-amd64\"}" \
        --assets-link "{\"name\":\"rcvd-netbsd-arm64\",\"url\":\"${PKG}/rcvd-netbsd-arm64\"}" \
        --assets-link "{\"name\":\"rcvd-freebsd-amd64\",\"url\":\"${PKG}/rcvd-freebsd-amd64\"}" \
        --assets-link "{\"name\":\"rcvd-freebsd-arm64\",\"url\":\"${PKG}/rcvd-freebsd-arm64\"}" \
        --assets-link "{\"name\":\"SHA256SUMS\",\"url\":\"${PKG}/SHA256SUMS\"}"
  cache:
    - key: *ref_0
      paths: *ref_1
      policy: pull-push
      when: on_success
default:
  image: docker.io/library/golang:1.26.4-alpine
  cache:
    key: *ref_0
    paths: *ref_1
