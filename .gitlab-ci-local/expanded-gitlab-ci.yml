stages:
  - .pre
  - test
  - build
  - release
  - .post
variables:
  CGO_ENABLED: '0'
  GOPATH: $CI_PROJECT_DIR/.gocache/gopath
  GOCACHE: $CI_PROJECT_DIR/.gocache/gobuild
.build_ldflags: >
  BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

  BUILD_VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"

  LDFLAGS="-s -w -X main.buildDate=${BUILD_DATE} -X
  main.buildSource=gitlab-runner -X main.version=${BUILD_VERSION}"
test:
  stage: test
  script:
    - go vet ./...
    - go test ./...
  cache:
    - key: &ref_0
        files:
          - go.sum
      paths: &ref_1
        - .gocache/
      policy: pull-push
      when: on_success
  image:
    name: docker.io/library/golang:1.26.4-alpine
verify-anchors:
  stage: test
  script:
    - apk add --no-cache openssl curl
    - sh scripts/verify-anchors.sh
  cache:
    - key: *ref_0
      paths: *ref_1
      policy: pull-push
      when: on_success
  image:
    name: docker.io/library/golang:1.26.4-alpine
.build:
  stage: build
  needs:
    - test
    - verify-anchors
  script:
    - >
      BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      BUILD_VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"

      LDFLAGS="-s -w -X main.buildDate=${BUILD_DATE} -X
      main.buildSource=gitlab-runner -X main.version=${BUILD_VERSION}"
    - >-
      GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" go build -trimpath -ldflags
      "$LDFLAGS" -o "$ARTIFACT" ./cmd/rcvd
    - echo "Built $ARTIFACT ($BUILD_VERSION, $BUILD_DATE)"
  artifacts:
    name: $ARTIFACT
    paths:
      - $ARTIFACT
    expire_in: 30 days
build:linux-amd64:
  stage: build
  needs:
    - job: test
      artifacts: true
      optional: false
    - job: verify-anchors
      artifacts: true
